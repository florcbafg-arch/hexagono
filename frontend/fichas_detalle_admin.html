<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Ficha Técnica</title>

  <link rel="stylesheet" href="styles.css">

  <script src="js/api.js"></script>\n  <script src="js/authGuard.js"></script>\n  <script src="js/auth.js"></script>

  <script>
    checkAuth("admin")
  </script>
  <style>
 .historial-versiones {
    max-width: 190mm;
    margin: 0 auto 16px;
    background: #fff;
    border: 1px solid #d7dce5;
    border-radius: 10px;
    overflow: hidden;
  }
  .historial-cabecera {
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding:12px 14px;
  }
  .historial-cabecera strong { display:block; }
  .historial-cabecera span { font-size:12px; color:#737b8c; }
  .historial-toggle, .historial-acciones button {
    border:0; border-radius:7px; padding:6px 10px; cursor:pointer;
    background:#673df4; color:#fff;
  }
  .historial-lista { border-top:1px solid #e5e7eb; }
  .historial-fila {
    display:grid; grid-template-columns:1fr 1fr 1fr auto;
    gap:10px; align-items:center; padding:10px 14px;
    border-bottom:1px solid #eef0f4; font-size:13px;
  }
  .historial-fila:last-child { border-bottom:0; }
  .historial-fila.actual { background:#f5f2ff; }
  .historial-actual {
    display:inline-block; margin-left:6px; padding:2px 6px;
    border-radius:999px; background:#e8e1ff; color:#5b32d6 !important;
    font-size:10px !important;
  }
  .historial-estado { text-transform:capitalize; }
  .historial-fecha { color:#737b8c; }
  .historial-error,.historial-vacio { padding:12px 14px; color:#777; }

@media print {
  body {
    margin: 0;
    padding: 0;
    background: #fff !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .header,
  h1,
  button,
  .historial-versiones {
    display: none !important;
  }

  .container,
  .main,
  #contenido {
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    box-shadow: none !important;
    background: #fff !important;
    width: 100% !important;
    max-width: 100% !important;
  }

  #hojaFicha {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  background: #fff !important;
  color: #000 !important;
  overflow: visible !important;
}

  #hojaFicha > div {
    width: 190mm !important;
    height: 277mm !important;
    max-width: 190mm !important;
    box-sizing: border-box !important;
    margin: 0 auto !important;
    overflow: hidden !important;
    page-break-after: always !important;
    break-after: page !important;
  }

  #hojaFicha > div:last-child {
    page-break-after: auto !important;
    break-after: auto !important;
  }

  #hojaFicha * {
    box-sizing: border-box !important;
  }

  #hojaFicha img {
    max-width: 100% !important;
  }

  #hojaFicha {
    overflow: visible !important;
  }

  #hojaFicha,
  #hojaFicha * {
    font-family: Arial, Helvetica, sans-serif !important;
  }

  #hojaFicha * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  @page {
    size: A4 portrait;
    margin: 10mm;
  }
}
</style>
</head>

<body>
<div class="container">


  <div class="main">
    <div class="header">Panel Administrador</div>

    <div id="contenido">
  <h1>Detalle Ficha Técnica</h1>

 <div style="margin-bottom:20px; display:flex; gap:10px;">
  <button onclick="window.print()">🖨 Imprimir</button>
  <button onclick="editarFicha()">✏ Editar</button>
  <button onclick="volver()">⬅ Volver</button>
</div>

  <div id="historialVersiones" class="historial-versiones"></div>

  <div id="hojaFicha"></div>
</div>
  </div>

</div>

<script src="js/fichas_detalle_admin.js?v=2"></script>
<script>
  function logout() {
    localStorage.removeItem("token")
    localStorage.removeItem("usuario")
    window.location.href = "login.html"
  }
</script>
</body>
</html>
