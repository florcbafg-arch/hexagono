<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login - HEXAFLOW</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="login-brand">
  <img src="img/hexaflow-loco-pro.png" alt="HEXAFLOW" class="login-logo-full">
  <div class="subtitulo">Control de producción</div>
</div>

      <div id="recoveryBox" hidden>
        <h2 style="text-align:center">Nueva contraseña</h2>
        <p style="text-align:center">Elegí una nueva contraseña para tu cuenta.</p>
        <form id="recoveryForm">
          <input type="password" id="newPassword" placeholder="Nueva contraseña" autocomplete="new-password" minlength="8" required>
          <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password" minlength="8" required>
          <button type="submit">Guardar contraseña</button>
        </form>
      </div>

      <div id="loginBox">
      <!-- ✅ FORM CORRECTO -->
      <form id="loginForm">

        <input type="text" id="usuario" placeholder="Email" required>

        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>

      </form>

      <!-- ✅ LINK FUERA DEL FORM -->
      <div class="link">
        ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
      </div>
      </div>

    </div>
  </div>

  <!-- ✅ SCRIPT ABAJO -->
  <script>

window.addEventListener("DOMContentLoaded", () => {
  const tema = localStorage.getItem("hexaflow_theme")

  if (tema === "dark") {
    document.body.classList.add("dark-mode")
  }
})


    const hashParams = new URLSearchParams(window.location.hash.substring(1))
    const recoveryToken = hashParams.get("access_token")
    const recoveryType = hashParams.get("type")

    if (recoveryToken && recoveryType === "recovery") {
      document.getElementById("loginBox").hidden = true
      document.getElementById("recoveryBox").hidden = false
    }

    document.getElementById("recoveryForm").addEventListener("submit", async (e) => {
      e.preventDefault()
      const password = document.getElementById("newPassword").value
      const confirm = document.getElementById("confirmPassword").value

      if (password !== confirm) {
        alert("Las contraseñas no coinciden")
        return
      }

      try {
        const res = await fetch("/api/auth/recovery-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ access_token: recoveryToken, password })
        })
        const data = await res.json()
        if (!res.ok || !data.ok) {
          alert(data.error || "No se pudo actualizar la contraseña")
          return
        }

        alert("Contraseña actualizada. Ya podés ingresar.")
        window.history.replaceState({}, document.title, "/")
        window.location.reload()
      } catch (error) {
        console.error("ERROR RECOVERY:", error)
        alert("Error conectando con el servidor")
      }
    })

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault()

        console.log("CLICK LOGIN 🔥")

        const usuario = document.getElementById("usuario").value
        const password = document.getElementById("password").value


        try {

          const esEmail = usuario.includes("@")

const endpoint = esEmail
  ? "/api/auth/login"
  : "/api/auth/login-operario"

const body = esEmail
  ? { email: usuario, password }
  : { codigo_acceso: usuario, pin: password }

const res = await fetch(endpoint, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify(body)
})
          

          const data = await res.json()
          console.log("RESP LOGIN:", data)

if (!esEmail && data.ok) {
  const operario = data.operario || data.usuario || data.user || null

  if (!operario) {
    throw new Error("La respuesta del login operario no trajo datos del usuario")
  }

localStorage.setItem("hexagono_user", JSON.stringify({
  id: operario.id,
  nombre: operario.nombre,
  rol: operario.rol,
  empresa_id: operario.empresa_id,
  tipo_login: "operario",
  login_time: Date.now()
}))

localStorage.setItem("token", data.token)
localStorage.removeItem("empresa_id")

  window.location.href = "/fichas_operario.html"
}

          console.log("RESPUESTA:", data)

         if (data.ok && data.usuario) {

  const usuarioFinal = {
    ...data.usuario,
    login_time: Date.now()
  }

  localStorage.setItem("token", data.token)
  localStorage.setItem("hexagono_user", JSON.stringify(usuarioFinal))
  localStorage.setItem("usuario", usuarioFinal.nombre)
  localStorage.setItem("puesto_id", usuarioFinal.puesto_id || "")
  localStorage.setItem("rol", usuarioFinal.rol || "")

  if (usuarioFinal.rol === "admin") {
    window.location.href = "admin.html"
  } else {
    window.location.href = "operario.html"
  }

} else {
  alert(data.error || "Usuario o contraseña incorrectos")
}

        } catch (error) {
          console.error("ERROR LOGIN:", error)
          alert("Error conectando con el servidor")
        }

      })
  </script>

  <script src="js/enter_navigation.js"></script>\n</body>
</html>
