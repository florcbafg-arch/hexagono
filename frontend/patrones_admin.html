<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAFLOW — Patrón Técnico</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/authGuard.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    checkAuth("admin")
    if (!localStorage.getItem("hexagono_user")) window.location.href = "login.html"
  </script>
  <style>
    .patron-v2-wrap{max-width:1400px;margin:0 auto;padding:28px}
    .patron-v2-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
    .patron-v2-top h2{margin:0 0 6px}.patron-v2-sub{opacity:.72;margin:0}
    .patron-selector{min-width:360px;max-width:620px;flex:1}
    .patron-selector label{display:block;font-weight:700;margin-bottom:7px}
    .patron-selector select{width:100%;padding:11px 12px;border-radius:8px}
    .patron-meta{display:none;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}
    .patron-meta.visible{display:grid}
    .patron-meta-card{border:1px solid rgba(128,128,128,.28);border-radius:10px;padding:12px}
    .patron-meta-card small{display:block;opacity:.65;margin-bottom:4px}.patron-meta-card strong{display:block}
    .patron-aviso{padding:16px;border:1px solid rgba(128,128,128,.28);border-radius:10px;margin:18px 0}
    .patron-bloque{margin:22px 0;border:1px solid rgba(128,128,128,.25);border-radius:12px;overflow:hidden}
    .patron-bloque-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:rgba(128,128,128,.10)}
    .patron-bloque-head h3{margin:0;font-size:16px}
    .patron-tabla-v2{width:100%;border-collapse:collapse}.patron-tabla-v2 th,.patron-tabla-v2 td{padding:10px;border-top:1px solid rgba(128,128,128,.18);text-align:left;vertical-align:middle}
    .patron-tabla-v2 th{font-size:12px;opacity:.72}.patron-tabla-v2 input,.patron-tabla-v2 select{width:100%;box-sizing:border-box;padding:8px}
    .patron-bloque-input{min-width:180px;padding:8px}
    .patron-actions{display:none;justify-content:flex-end;gap:10px;margin-top:22px}.patron-actions.visible{display:flex}
    .patron-actions button{padding:11px 18px;border-radius:8px;cursor:pointer}
    .tarea-panel{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.58);padding:24px;overflow:auto;align-items:flex-start;justify-content:center}.tarea-panel.visible{display:flex}.tarea-modal{width:min(1100px,96vw);max-height:90vh;overflow:auto;background:var(--card-bg,#eef2f7);color:inherit;border:1px solid rgba(128,128,128,.35);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}.tarea-grid-wrap{overflow-x:auto;margin-top:14px}
    .tarea-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tarea-curva{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}.tarea-curva th,.tarea-curva td{padding:8px;border:1px solid rgba(128,128,128,.18);text-align:center}.tarea-curva th:first-child,.tarea-curva td:first-child{width:110px;text-align:left;font-weight:700}.tarea-curva input{width:100%;padding:8px;box-sizing:border-box;text-align:center}.tarea-curva .talle-head{display:flex;gap:5px;align-items:center}.tarea-curva .talle-head button{padding:3px 6px}.tarea-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tarea-btns button{padding:9px 13px;border-radius:8px;cursor:pointer}.tarea-resultado{margin-top:18px}.tarea-alerta{padding:12px;border:1px solid rgba(128,128,128,.3);border-radius:9px;margin:10px 0}.tarea-total{font-weight:800}
    .patron-rinde-chips{display:flex;flex-wrap:wrap;gap:4px}.patron-rinde-chip{white-space:nowrap;border:1px solid rgba(128,128,128,.3);border-radius:6px;padding:3px 5px;font-size:10px}.patron-rinde-falta{font-size:10px;opacity:.65}
    .patron-print-toolbar{display:flex;justify-content:flex-end;margin:10px 0}.patron-print-toolbar button{padding:9px 14px;border-radius:8px;cursor:pointer}
    .patron-print-toolbar button:disabled{opacity:.55;cursor:not-allowed}
    @media print{#patronTareaPrint[data-completo="false"]{display:none!important}}
    .patron-print{background:#fff;color:#111;padding:18px 20px;border-radius:8px;font-family:Arial,Helvetica,sans-serif}.patron-print h2{text-align:center;margin:0 0 12px;font-size:18px;letter-spacing:.2px}.patron-print-identidad{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:5px 20px;margin-bottom:10px;font-size:12px}.patron-print-curva{width:auto;border-collapse:collapse;margin:8px 0 12px;font-size:11px}.patron-print-curva th,.patron-print-curva td{border:1px solid #666;padding:3px 9px;text-align:center}.patron-print-bloque{margin:0 0 8px}.patron-print-bloque-title{text-align:center;font-weight:800;background:#747474;color:#fff;padding:3px 5px;font-size:11px;letter-spacing:.15px}.patron-print-bloque table{width:100%;border-collapse:collapse;table-layout:fixed}.patron-print-bloque th,.patron-print-bloque td{border-bottom:1px solid #999;padding:3px 5px;text-align:left;font-size:10.5px;line-height:1.12;overflow-wrap:anywhere}.patron-print-bloque th{font-weight:700}.patron-print-bloque th:nth-child(1){width:24%}.patron-print-bloque th:nth-child(2){width:30%}.patron-print-bloque th:nth-child(3){width:28%}.patron-print-bloque th:nth-child(4){width:8%;text-align:center}.patron-print-bloque th:nth-child(5){width:10%;text-align:right}.patron-print-bloque td:nth-child(4){text-align:center}.patron-print-bloque td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
    .patron-muted{opacity:.65;font-size:12px}.patron-status{font-size:12px;font-weight:700}
    @page{size:A4 portrait;margin:10mm}
    @media print{#patronTareaPrint[data-completo="false"]{display:none!important}}
    @media(max-width:760px){.patron-v2-wrap{padding:16px}.patron-selector{min-width:100%}.patron-tabla-v2{display:block;overflow-x:auto;white-space:nowrap}}
  </style>
</head>
<body onload="initPatrones()">
  <main class="patron-v2-wrap">
    <div class="patron-v2-top">
      <div>
        <h2>Patrón técnico del artículo</h2>
        <p class="patron-v2-sub">Estructura reutilizable de piezas y materiales tomada de la Ficha Técnica vigente.</p>
      </div>
      <div class="patron-selector">
        <label for="articuloSelect">Artículo</label>
        <select id="articuloSelect">
          <option value="">Seleccionar artículo</option>
        </select>
      </div>
    </div>

    <section id="patronMeta" class="patron-meta"></section>
    <div id="patronMensaje" class="patron-aviso">Seleccioná un artículo para cargar su patrón técnico.</div>
    <section id="patronBloques"></section>

    <div id="patronActions" class="patron-actions">
      <button type="button" onclick="abrirCalculoTarea()">🧮 Calcular patrón de tarea</button>
      <button type="button" onclick="recargarPatron()">↻ Restablecer desde ficha</button>
      <button id="btnGuardarPatron" type="button" onclick="guardarPatron()">💾 Guardar patrón técnico</button>
    </div>
    <section id="tareaPanel" class="tarea-panel"></section>
  </main>
  <script src="js/patrones_admin.js"></script>
  <script src="js/enter_navigation.js"></script>
</body>
</html>
