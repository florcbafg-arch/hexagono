<div class="ficha-editor-v2">
  <div class="ficha-editor-head">
    <div>
      <div class="ficha-eyebrow">MAESTROS TÉCNICOS</div>
      <h1 id="tituloFichaV2">Ficha Técnica</h1>
      <p id="subtituloFichaV2">Cargando artículo y versión…</p>
    </div>
    <div id="estadoFichaV2" class="ficha-badge">Borrador</div>
  </div>

  <div id="mensajeFichaV2"></div>

  <section class="ficha-card ficha-identidad">
    <div><span>Código</span><strong id="fCodigo">-</strong></div>
    <div><span>Modelo</span><strong id="fModelo">-</strong></div>
    <div><span>Marca</span><strong id="fMarca">-</strong></div>
    <div><span>Color</span><strong id="fColor">-</strong></div>
    <div><span>Versión</span><strong id="fVersion">-</strong></div>
    <div>
      <label for="fSistema">Sistema constructivo</label>
      <select id="fSistema"><option value="vulcanizado">Vulcanizado</option><option value="pegado">Pegado</option></select>
    </div>
  </section>

  <div class="ficha-layout-v2">
    <aside class="ficha-card ficha-nav">
      <h3>Secciones</h3>
      <div id="listaSeccionesV2"></div>
    </aside>

    <main class="ficha-card ficha-contenido">
      <div id="editorSeccionV2"></div>
    </main>

    <aside class="ficha-card ficha-preview-v2">
      <h3>Resumen</h3>
      <div id="previewFichaV2"></div>
    </aside>
  </div>

  <section class="ficha-card ficha-generales">
    <label>Detalle general</label>
    <textarea id="fDetalle" rows="3" placeholder="Detalle general de fabricación"></textarea>
    <label>Observaciones generales</label>
    <textarea id="fObservaciones" rows="3" placeholder="Observaciones generales"></textarea>
  </section>

  <div class="ficha-actions">
    <button onclick="volverFichasV2()">⬅ Volver</button>
    <button id="btnGuardarFichaV2" onclick="guardarFichaV2()">💾 Guardar borrador</button>
  </div>
</div>
